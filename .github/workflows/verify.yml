name: Windows verification
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.lock
      - run: python -m app.tools.make_fixtures
      - run: python -m pytest --junitxml=.test_runs/results.xml
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m PyInstaller NunchiCoach.spec
      - run: dist/NunchiCoach/NunchiCoach.exe selftest tests/fixtures/sample_tree
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: .test_runs/results.xml
